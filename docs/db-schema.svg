<text class="caption" x="30" y="318">no relations (infrastructure)</text>
<text class="h1" x="380" y="515" style="font-size:14px">Constraints</text>
<text class="note" x="380" y="537">• user_poll: one owner per poll – unique (id_poll) WHERE is_owner = 1</text>
<text class="note" x="380" y="557">• questions: unique (id_poll, sort_order) WHERE deleted_at IS NULL</text>
<text class="note" x="380" y="577">• answers: unique (id_question, id_user) – one answer per user and question</text>
<text class="note" x="380" y="597">• Soft delete: polls.deleted_at, questions.deleted_at (hidden by query filters)</text>
<text class="note" x="380" y="617">• CHECK not empty: users.name, polls.title, questions.question, answers.answer</text>
<text class="note" x="380" y="637">• threshold_warnings.resource IN (&#x27;users&#x27;, &#x27;polls&#x27;); dates are UTC (SYSUTCDATETIME())</text>
<text class="note" x="30" y="665">PK primary key · FK foreign key · UQ unique · 1 ── * one-to-many · NULL = optional, all other columns NOT NULL</text>
</svg>
