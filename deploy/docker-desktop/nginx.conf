# polls-web on Docker Desktop: deploy/nginx.conf plus the /api proxy that a cluster route does elsewhere (D19).
# Mounted over /etc/nginx/conf.d/default.conf by the overlay; keep the rest in sync with deploy/nginx.conf.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # API: same origin, so no CORS and the session cookie works
    location /api {
        proxy_pass http://polls-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles (outputHashing: all): cache for a year
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Probe for Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA: unknown paths serve index.html (client-side routes); never cache it, so new deployments load at once
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
