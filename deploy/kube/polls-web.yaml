# Angular SPA on unprivileged nginx (port 8080). Same origin as the API through the route: / → here, /api → polls-api (D19).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polls-web
  labels:
    app.kubernetes.io/name: polls-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polls-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polls-web
    spec:
      automountServiceAccountToken: false
      # Created and rotated per namespace outside these manifests (D53)
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: polls-web
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes its pid and temp files here
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: polls-web
  labels:
    app.kubernetes.io/name: polls-web
spec:
  selector:
    app.kubernetes.io/name: polls-web
  ports:
    - name: http
      port: 8080
      targetPort: http
